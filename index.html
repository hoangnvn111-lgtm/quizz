<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e8c">
<title>Ôn tập Kinh tế chính trị Mác – Lênin</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--text:#1b2433;--muted:#667085;--pri:#1f4e8c;--ok:#1a8f4c;--okbg:#e5f6ec;--no:#c62828;--nobg:#fdeaea;--bd:#d7deea}
[data-theme=dark]{--bg:#0f1520;--card:#18202e;--text:#e6ebf4;--muted:#93a0b5;--pri:#5b9bf0;--ok:#4cc27f;--okbg:#14301f;--no:#ff7a7a;--nobg:#3a1818;--bd:#2b3648}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.badge{color:var(--pri);font-weight:600}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--bd);color:var(--text);border-radius:8px;padding:6px 12px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
h1{font-size:1.6rem;margin:.3em 0}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:10px 0}
.mod{display:block;width:100%;text-align:left;color:var(--text)}
.mod:hover{border-color:var(--pri)}
.mod b{color:var(--pri)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--text);border:1.5px solid var(--bd);border-radius:10px;padding:12px 14px;margin:8px 0}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--no);background:var(--nobg)}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--pri);transition:width .2s}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.score{font-size:2.4rem;font-weight:700;color:var(--pri)}
label.chk{display:flex;gap:8px;align-items:center;margin:8px 0}
.rev{border-left:4px solid var(--no);padding-left:10px;margin:12px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="ghost" id="home" onclick="showHome()" hidden>← Trang chủ</button>
    <span class="badge" id="badge">🎓 Ôn tập trắc nghiệm</span>
    <button class="ghost" onclick="toggleTheme()" title="Sáng/Tối">🌓</button>
  </header>
  <main id="app"></main>
</div>
<script src="questions.js"></script>
<script src="questions_tqlkt.js"></script>
<script src="questions_dethi.js"></script>
<script>
const $ = id => document.getElementById(id);
const app = $('app');
let opts = {shuffle: false}, S = null, SUB = null;
const SUBJECTS = [
  {name: 'Kinh tế chính trị Mác – Lênin', data: DATA},
  {name: 'Tổ chức và quản lý kinh tế', data: DATA_TQL},
  {name: 'Đề ôn tập KTCT Mác – Lênin (Chương 2–3)', data: DATA_DE}
];

function toggleTheme(){
  const d = document.documentElement;
  const t = d.dataset.theme === 'dark' ? 'light' : 'dark';
  d.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch(e){}
}
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch(e){}

function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function showHome(){
  S = null; SUB = null; $('home').hidden = true;
  app.innerHTML = `
    <h1>Ôn tập trắc nghiệm</h1>
    <p class="muted">Chọn môn học để bắt đầu.</p>
    ${SUBJECTS.map((m,i)=>`<button class="card mod" onclick="showSubject(${i})"><b>${esc(m.name)}</b><br>${m.data.length} chương · ${m.data.reduce((n,c)=>n+c.qs.length,0)} câu</button>`).join('')}`;
}

function showSubject(i){
  SUB = SUBJECTS[i]; S = null; $('home').hidden = false;
  const D = SUB.data, total = D.reduce((n,c)=>n+c.qs.length,0);
  app.innerHTML = `
    <h1>${esc(SUB.name)}</h1>
    <p class="muted">${total} câu hỏi. Chọn phần để bắt đầu làm bài.</p>
    <label class="chk"><input type="checkbox" ${opts.shuffle?'checked':''} onchange="opts.shuffle=this.checked"> Trộn thứ tự câu hỏi</label>
    ${D.length > 1 ? D.map(c=>`<button class="card mod" onclick="start(${c.id})"><b>Chương ${c.id}</b> · ${c.qs.length} câu<br>${esc(c.title)}</button>`).join('') : ''}
    <button class="card mod" onclick="start(0)"><b>${D.length > 1 ? 'Tất cả các chương' : 'Bắt đầu làm bài'}</b> · ${total} câu</button>`;
}

function start(id, list, title){
  let qs = list || (id === 0 ? SUB.data.flatMap(c => c.qs.map(q => ({...q, ch: c.id}))) : SUB.data.find(c=>c.id===id).qs.map(q => ({...q, ch: id})));
  if (opts.shuffle) qs = shuffle(qs);
  S = {qs, i: 0, score: 0, wrong: [], picked: null, title: title || (id ? 'Chương ' + id : SUB.name)};
  $('home').hidden = false;
  render();
}

function render(){
  const q = S.qs[S.i], n = S.qs.length;
  const done = S.picked !== null;
  app.innerHTML = `
    <div class="muted">${S.title} · Câu ${S.i+1}/${n} · Đúng: ${S.score}</div>
    <div class="bar"><i style="width:${S.i/n*100}%"></i></div>
    <div class="card"><b>${esc(q.q)}</b></div>
    ${q.o.map((t,k)=>{
      let c = '';
      if (done) c = k === q.a ? 'ok' : (k === S.picked ? 'no' : '');
      return `<button class="opt ${c}" ${done?'disabled':''} onclick="pick(${k})"><b>${'ABCD'[k]}.</b> ${esc(t)}</button>`;
    }).join('')}
    ${done ? `<p>${S.picked===q.a ? '✅ Chính xác!' : '❌ Sai rồi. Đáp án đúng: <b>' + 'ABCD'[q.a] + '</b>'}</p>` : ''}
    <div class="row"><button class="btn" ${done?'':'disabled'} onclick="next()">${S.i+1===n?'Xem kết quả':'Câu tiếp →'}</button></div>`;
}

function pick(k){
  if (S.picked !== null) return;
  S.picked = k;
  const q = S.qs[S.i];
  if (k === q.a) S.score++; else S.wrong.push({...q, picked: k});
  render();
}

function next(){
  S.picked = null; S.i++;
  S.i >= S.qs.length ? result() : render();
}

function result(){
  const n = S.qs.length, pct = Math.round(S.score / n * 100);
  app.innerHTML = `
    <h1>Kết quả</h1>
    <div class="card"><div class="score">${S.score}/${n} (${pct}%)</div><div class="muted">${S.title}</div></div>
    <div class="row">
      ${S.wrong.length ? `<button class="btn" onclick="start(0, S.wrong.map(w=>({...w})), 'Làm lại câu sai')">Làm lại ${S.wrong.length} câu sai</button>` : ''}
      <button class="ghost" onclick="start(0, S.qs.map(q=>({...q})), S.title)">Làm lại từ đầu</button>
      <button class="ghost" onclick="showHome()">Về trang chủ</button>
    </div>
    ${S.wrong.length ? '<h3>Các câu làm sai</h3>' + S.wrong.map(w => `
      <div class="rev"><b>${esc(w.q)}</b><br>
      <span style="color:var(--no)">Bạn chọn: ${'ABCD'[w.picked]}. ${esc(w.o[w.picked])}</span><br>
      <span style="color:var(--ok)">Đáp án: ${'ABCD'[w.a]}. ${esc(w.o[w.a])}</span></div>`).join('') : '<p>🎉 Bạn trả lời đúng tất cả!</p>'}`;
}

showHome();
</script>
</body>
</html>
